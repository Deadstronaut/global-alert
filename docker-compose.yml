# MHEWS — Docker Compose
#
# 3 parça: frontend (statik) + aggregator (Node) + DB.
# DB katmanı bu dosyada YOK — Supabase CLI ile yönetiliyor:
#   Cloud müşteri:      Supabase Cloud projesine bağlan (server/.env içindeki
#                        SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY ile).
#   Self-host müşteri:  `supabase start` (bkz. supabase/config.toml) DB+auth+
#                        realtime+studio stack'ini ayrıca ayağa kaldırır;
#                        aggregator ve frontend bu compose ile, DB Supabase
#                        CLI ile yönetilir. Migration'lar: `supabase db push`.
#
# Kullanım:
#   docker compose up -d

services:

  # ── GEWS Real-time Aggregator ──────────────────────────────────────────────
  aggregator:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mhews-aggregator
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    networks:
      - mhews

  # ── NetCDF/GDAL raster conversion service (spec 047) ─────────────────────────
  # Python + GDAL, always-on — the only piece of this stack that isn't
  # Deno/Node, because GDO Soil Moisture/FAPAR (NetCDF4/HDF5) and GloFAS
  # (GRIB2/NetCDF, see NEW_GAME_PLAN.md §4.2) have no mature Deno/Node
  # reader, and GDAL reads both natively. Deliberately has NO `ports:`
  # mapping — internal-only, reachable from other containers on the
  # `mhews` network (e.g. a future raster-importer script) at
  # http://netcdf-service:8000, never from the host or public internet,
  # matching spec 047 FR-002 ("network isolation is enough, no auth").
  # DATASET_REGISTRY in netcdf-service/app/main.py still has GDO's two
  # datasets as unwired 501 stubs as of 2026-07-22 pending the real HDX/GDO
  # archive URL research — this container is the proven, tested shell
  # (GDAL crop/convert + download cache + HTTP contract all work, see
  # netcdf-service/app/test_gdal_convert.py) waiting for those URLs.
  netcdf-service:
    build:
      context: ./netcdf-service
      dockerfile: Dockerfile
    container_name: mhews-netcdf-service
    restart: unless-stopped
    environment:
      - NETCDF_CACHE_DIR=/cache
    volumes:
      - netcdf-cache:/cache
    networks:
      - mhews

  # ── Meta/HDX downloader (manual, run-to-completion, one-time in practice) ────
  # Downloads+extracts each served country's Meta/HDX population GeoTIFF
  # from HDX (data.humdata.org) into RASTER_DB_PATH and regenerates
  # manifest.json — run this BEFORE meta-ghsl-importer the first time, or
  # to (re-)populate a fresh RASTER_DB_PATH on a new deployment. Needs
  # WRITE access to /rasters (unlike the other services below, which only
  # read it), and no restart policy / cron equivalent — see
  # download-meta.ts's header for why (HDX's own metadata says this
  # dataset is frozen, not updated since 2024).
  #   docker compose run --rm meta-downloader
  meta-downloader:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-meta-downloader
    command: ["raster-importer/download-meta.ts"]
    env_file:
      - ./server/.env
    environment:
      - RASTER_IMPORT_MANIFEST=/manifest.json
      - RASTERS_DIR=/rasters
    volumes:
      - ${RASTER_DB_PATH:-./raster-importer/_no_rasters}:/rasters
      - ./raster-importer/manifest.json:/manifest.json
    networks:
      - mhews

  # ── Meta/HDX population raster importer (manual, run-to-completion) ─────────
  # Not started by `docker compose up -d` — no restart policy, and by design
  # exits after processing its manifest once. Invoke explicitly:
  #   docker compose run --rm meta-ghsl-importer
  # See raster-importer/manifest.example.json and NEW_GAME_PLAN.md §4.1.
  # No scheduled equivalent (removed 2026-07-22) — Meta/HDX's dataset is
  # frozen (see download-meta.ts's header) and this only ever reprocesses
  # manifest.json, never re-downloads, so a recurring schedule would just
  # recompute identical output every month. Manual-only, like meta-downloader.
  meta-ghsl-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-meta-ghsl-importer
    env_file:
      - ./server/.env
    environment:
      - RASTER_IMPORT_MANIFEST=/manifest.json
    volumes:
      - ${RASTER_DB_PATH:-./raster-importer/_no_rasters}:/rasters:ro
      - ./raster-importer/manifest.json:/manifest.json:ro
    networks:
      - mhews

  # ── GHSL population importer (manual, run-to-completion) ────────────────────
  # Separate from meta-ghsl-importer above: GHSL downloads its own small
  # (~1.5MB) per-country tiles over the network (ghslFetch.ts, unmodified
  # from the Edge Function version) rather than reading a locally-mounted
  # file, so it needs no /rasters or manifest.json mount — just Supabase
  # credentials and outbound network access. See NEW_GAME_PLAN.md §4.1 for
  # why this had to move out of the Edge Function (WORKER_RESOURCE_LIMIT,
  # live-verified even after ghslFetch.ts's tile-based rewrite).
  #   docker compose run --rm ghsl-importer
  ghsl-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-ghsl-importer
    command: ["raster-importer/import-ghsl.ts"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # ── DEM slope / landslide susceptibility importer (manual, run-to-completion) ─
  # Downloads Copernicus GLO-30 elevation tiles per served country
  # (demSlopeFetch.ts) and writes only the steep-terrain hexagons as the
  # 'dem_slope' exposure source, feeding cascade_rules' landslide condition.
  # No /rasters or manifest.json mount needed — tiles come straight from
  # Copernicus's public S3 bucket. No scheduled equivalent: terrain doesn't
  # change on any meaningful cadence, so this is manual-only like
  # meta-ghsl-importer.
  # `container_name` below only applies to `docker compose up` — a one-off
  # `docker compose run` ignores it and auto-names the container
  # `<service>-run-<hash>` instead, so pass --name explicitly to get the
  # mhews-* naming every other service uses:
  #   docker compose run --rm --name mhews-dem-slope-importer dem-slope-importer
  dem-slope-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-dem-slope-importer
    command: ["raster-importer/import-dem-slope.ts"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # ── Building footprints importer (manual, run-to-completion) ────────────────
  # Downloads Microsoft Global ML Building Footprints tiles per served
  # country (buildingFootprintsFetch.ts) and writes per-hexagon building
  # counts as the 'building_footprints' exposure source (spec 050 US3).
  # No /rasters or manifest.json mount needed — tiles come from Microsoft's
  # public Azure blob storage. No scheduled equivalent — manual-only like
  # dem-slope-importer/meta-ghsl-importer. Turkey alone is ~1.7GB compressed
  # across 266 tiles; expect this to take a while.
  #   docker compose run --rm --name mhews-building-footprints-importer building-footprints-importer
  building-footprints-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-building-footprints-importer
    command: ["raster-importer/import-building-footprints.ts"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # ── CHIRPS monthly rainfall importer (manual, run-to-completion) ────────────
  # Single global monthly GeoTIFF (chirpsFetch.ts), no tile grid unlike GHSL —
  # no /rasters or manifest.json mount needed, just Supabase credentials and
  # outbound network access.
  #   docker compose run --rm chirps-importer
  chirps-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-chirps-importer
    command: ["raster-importer/import-chirps.ts"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # ── GloFAS river discharge importer (manual, run-to-completion) ─────────────
  # EWDS (submit/poll/download, ewdsClient.ts) -> netcdf-service (GDAL
  # NetCDF->GeoTIFF conversion) -> exposure_datasets. See
  # raster-importer/import-glofas.ts's header for the full chain.
  # GLOFAS_NETCDF_VARIABLE_NAME ("dis24") and the whole pipeline are now
  # live-verified end-to-end (2026-07-22, real EWDS token) — see
  # NEW_GAME_PLAN.md §4.2. Needs EWDS_API_KEY, kept in the gitignored
  # server/.env.local (NOT server/.env, which is tracked in git — see
  # server/.env.local.example). Also requires accepting the
  # cems-glofas-forecast dataset's licence on the EWDS website once per
  # account (a 403 with a clear message otherwise, not a code bug).
  #   docker compose run --rm glofas-importer
  glofas-importer:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-glofas-importer
    command: ["raster-importer/import-glofas.ts"]
    env_file:
      - ./server/.env
      - path: ./server/.env.local
        required: false
    environment:
      - NETCDF_SERVICE_URL=http://netcdf-service:8000
    networks:
      - mhews

  # ── GloFAS importer, always-on / daily-scheduled ─────────────────────────────
  # Same as glofas-importer above, but stays running and fires itself daily
  # via Deno.cron — GloFAS publishes a new forecast daily, unlike GHSL/
  # Meta's monthly cadence, so this uses cron.ts's "glofas" job (a
  # different schedule than the monthly ones — see cron.ts).
  glofas-importer-scheduled:
    build:
      context: .
      dockerfile: raster-importer/Dockerfile
    container_name: mhews-glofas-importer-scheduled
    restart: unless-stopped
    command: ["raster-importer/cron.ts", "glofas"]
    env_file:
      - ./server/.env
      - path: ./server/.env.local
        required: false
    environment:
      - NETCDF_SERVICE_URL=http://netcdf-service:8000
    networks:
      - mhews

  # ── Wind/ocean-current flow-texture importer (manual, run-to-completion) ────
  # spec 053 — GFS wind U/V GRIB2 (NOMADS, fetch_gfs.py) -> GDAL -> RG-channel
  # PNG texture (grib_to_texture.py) -> Supabase Storage + flow_snapshots row.
  # A new Python+GDAL container, not netcdf-service or raster-importer's Deno
  # image (see wind-importer/Dockerfile's header and
  # specs/053-wind-flow-visualization/research.md §4 for why).
  #   docker compose run --rm wind-importer --layer-type=wind --once
  #   docker compose run --rm wind-importer --layer-type=ocean_current --once
  #
  # Every service below built from ./wind-importer shares this same
  # `image: mhews-wind-importer:latest` tag — without an explicit `image:`,
  # Compose tags each service's build as `<project>-<service>:latest`
  # separately, which meant "docker compose build wind-importer" silently
  # left the other ~10 services (temperature-importer-scheduled, etc.) on
  # a stale image. Live-verified 2026-08-06: after fixing the Mercator-
  # warp overlay bug, only the one-off `docker compose run wind-importer`
  # calls picked up the fix — recreating temperature-importer-scheduled's
  # *container* (`--force-recreate`) reran its still-old *image*, which
  # immediately re-uploaded the unwarped texture right over the freshly
  # fixed one. One shared tag means one build updates every container.
  wind-importer:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-wind-importer
    command: ["--layer-type=wind", "--once"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # ── Wind flow importer, always-on / 6-hourly-scheduled ───────────────────────
  # Same as wind-importer above, but stays running and re-imports every 6h
  # (matches GFS's own 00/06/12/18 UTC cycle, spec FR-007) via main.py's own
  # in-process loop — see main.py's header for why this doesn't use
  # raster-importer/cron.ts's Deno.cron pattern (different runtime, Python
  # not Deno).
  wind-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-wind-importer-scheduled
    restart: unless-stopped
    command: ["--layer-type=wind"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Same as wind-importer-scheduled above, for the ocean-currents layer
  # (spec User Story 4) — independent container so a stall/failure in one
  # layer's import never blocks the other's.
  currents-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-currents-importer-scheduled
    restart: unless-stopped
    command: ["--layer-type=ocean_current"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Same importer image, for the Waves animation (spec 054 US1, Ocean mode)
  # — reuses SimpleWindLayer as-is via the synthetic u/v vector encoding
  # (research.md §2), so it's just a third instance of the same
  # scheduled-loop pattern, not a new codebase.
  waves-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-waves-importer-scheduled
    restart: unless-stopped
    command: ["--layer-type=wave"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Air-quality Overlay (spec 054 US2, Chem/Particulates mode) — a
  # different CLI mode (--overlay-type, not --layer-type) on the same
  # image, since it shares the GDAL/Python foundation but writes to
  # overlay_snapshots instead of flow_snapshots.
  overlay-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-overlay-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=air_quality_pm25"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Overlay: Temp (spec 054 follow-up, 2026-08-05) — GFS 2m air temperature
  # (fetch_gfs.py's fetch_latest_temperature_grib2), same image/pattern as
  # overlay-importer-scheduled above, independent container so a stall in
  # one overlay never blocks the other.
  temperature-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-temperature-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=temperature"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Air mode's remaining "easy" GFS-native Overlay fields (spec 054
  # follow-up, 2026-08-05) — same image/pattern as temperature-importer-
  # scheduled above, one independent container per field.
  relative-humidity-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-relative-humidity-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=relative_humidity"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Height selector (spec 054 follow-up, 2026-08-06) — Temp/RH at GFS's
  # other pressure levels, one container per field looping through all 7
  # levels each 6h cycle (main.py's --levels) rather than 7 more
  # containers each — the sfc-only services above stay untouched/unaware
  # of this, so a stall in the levels loop never blocks the always-shown
  # surface layer.
  temperature-levels-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-temperature-levels-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=temperature", "--levels=1000,850,700,500,250,70,10"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  relative-humidity-levels-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-relative-humidity-levels-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=relative_humidity", "--levels=1000,850,700,500,250,70,10"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Animate: Wind at GFS's other pressure levels (2026-08-06 follow-up —
  # user feedback: Height changed the Temp/RH Overlay coloring but not
  # the animated wind pattern itself, since Animate: Wind always used
  # --layer-type=wind's own hardcoded 'sfc'). Same one-container-loops-
  # all-7-levels shape as the two services above; wind-importer-scheduled
  # (sfc-only, Animate: Wind's original always-on default) stays
  # untouched.
  wind-levels-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-wind-levels-importer-scheduled
    restart: unless-stopped
    command: ["--layer-type=wind", "--levels=1000,850,700,500,250,70,10"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  mslp-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-mslp-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=mean_sea_level_pressure"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  cape-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-cape-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=cape"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  pwat-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-pwat-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=total_precipitable_water"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  cwat-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-cwat-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=total_cloud_water"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  precip-3hr-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-precip-3hr-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=precip_3hr"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Overlay: WBT (spec 054 follow-up, 2026-08-06) — GFS has no wet-bulb
  # field of its own, so this fetches Temp+RH together and derives it via
  # Stull's approximation (overlay_texture.py's _stull_wet_bulb_c).
  wbt-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-wbt-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=wet_bulb_temp"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Particulates mode's remaining Overlay entries (spec 054 follow-up,
  # 2026-08-06) — CAMS-sourced, same image/pattern as overlay-importer-
  # scheduled (PM2.5) above.
  pm1-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-pm1-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=pm1"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  pm10-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-pm10-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=pm10"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  dust-aod-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-dust-aod-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=dust_aod"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  organic-matter-aod-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-organic-matter-aod-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=organic_matter_aod"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  sulfate-aod-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-sulfate-aod-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=sulfate_aod"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Chem mode (spec 054 follow-up, 2026-08-06) — CO/SO2/NO2 @ 1000mb
  # surface proxy, same CAMS image/pattern as the Particulates services
  # above. CO2sc has no CAMS data source (see fetch_overlay_cams.py's own
  # comment) so there's no co2-importer-scheduled here.
  co-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-co-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=co_surface"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  so2-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-so2-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=so2_surface"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  no2-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-no2-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=no2_surface"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Space mode (spec 054 follow-up, 2026-08-06) — Overlay: Aurora, NOAA
  # SWPC's public OVATION Prime JSON feed. No CAMS/cdsapi/COPERNICUS_*
  # credentials needed (unlike every service above except the GFS ones)
  # — just a plain public HTTP GET, so env_file is still included for
  # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY but nothing aurora-specific.
  aurora-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-aurora-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=aurora"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  # Air/Ocean's remaining easy wins (spec 054 follow-up, 2026-08-06) —
  # Dew and WPD are GFS-native (same pattern as temperature-importer-
  # scheduled etc.); significant-wave-height-importer-scheduled reuses the
  # exact same WAVEWATCH III fetch waves-importer-scheduled already makes
  # for Animate: Waves, just coloring HTSGW instead of building the vector
  # texture — an independent container regardless, so a stall here never
  # blocks the particle animation.
  dew-point-importer-scheduled:
    build:
      context: ./wind-importer
      dockerfile: Dockerfile
    image: mhews-wind-importer:latest
    container_name: mhews-dew-point-importer-scheduled
    restart: unless-stopped
    command: ["--overlay-type=dew_point"]
    env_file:
      - ./server/.env
    networks:
      - mhews

  wpd-importer-scheduled:
