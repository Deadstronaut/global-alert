server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Vite's hashed filenames (assets/*-<hash>.js) are safe to cache forever;
    # index.html itself must never be cached, or a deploy can leave clients
    # stuck loading an old build's now-404ing asset URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history mode (createWebHistory) — any path not matching a
    # real static file falls back to index.html so client-side routing
    # resolves it, instead of nginx 404ing on a hard refresh of e.g. /admin.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
